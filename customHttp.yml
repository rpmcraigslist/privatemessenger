customHeaders:
  # HTML shell + SW must always revalidate so new deploys are discovered.
  - pattern: '**/*.html'
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: /
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: /sw.js
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: /manifest.webmanifest
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  - pattern: /amplify_outputs.json
    headers:
      - key: Cache-Control
        value: 'no-cache, no-store, must-revalidate'
  # Fingerprinted Vite assets can be cached permanently.
  - pattern: /assets/*
    headers:
      - key: Cache-Control
        value: 'public, max-age=31536000, immutable'
